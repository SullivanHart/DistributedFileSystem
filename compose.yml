x-node: &node
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  environment:
    PYTHONUNBUFFERED: "1"

services:
  master:
    <<: *node
    command: python -m http.server 8000 --bind 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"

  chunk1:
    <<: *node
    command: python -m http.server 8000 --bind 0.0.0.0 --directory /data
    volumes:
      - .:/app
      - chunk1-data:/data

  client:
    <<: *node
    command: ["sleep", "infinity"]

volumes:
  chunk1-data: